name: Build EbookTranslator EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'scripts/**'
      - 'template/**'
      - 'requirements.txt'
      - 'EbookTranslator.spec'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall app.py scripts
      - name: Build EXE
        run: pyinstaller --clean --noconfirm EbookTranslator.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookTranslator-windows
          path: dist/EbookTranslator.exe
          if-no-files-found: error
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EbookTranslator v${{ github.run_number }}
          generate_release_notes: true
          files: dist/EbookTranslator.exe
